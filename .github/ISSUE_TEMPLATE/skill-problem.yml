name: Problem with a skill
description: Wrong details, broken links, or a skill that looks unsafe or removed.
labels: ["skill"]
body:
  - type: input
    id: url
    attributes:
      label: Skill page URL
      placeholder: https://skill-sets.md/skills/owner/repo/skill/
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - Wrong or outdated details
        - Broken link
        - Looks unsafe
        - Removed or unavailable
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you saw, and what you expected.
    validations:
      required: true
